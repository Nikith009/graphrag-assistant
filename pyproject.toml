[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphrag-assistant"
version = "0.1.0"
description = "Question answering over documents with a knowledge graph, Leiden communities and multi-hop retrieval."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Veera Sai Nikith Kantipudi" }]
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "networkx>=3.7",
    "numpy>=1.26",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kgrag = "kgrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
